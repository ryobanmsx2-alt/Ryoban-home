<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryoban Personal Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="musica.css">
</head>
<body>

    <div class="ryoban-player-window">
        <header class="window-header">
            <span>DREAM MACHINE.exe</span>
            <span>_ [] X</span>
        </header>

        <div class="screen-container">
            <img src="DXNXMT.png" alt="Album Art" class="album-art" id="rp-art">
            <div class="track-overlay">
                <span id="rp-track-name">_</span>
            </div>
        </div>

        <div class="controls-area">
            
            <div class="progress-wrapper">
                <span id="rp-current">0:00</span>
                <input type="range" id="rp-seekbar" value="0" min="0" step="1">
                <span id="rp-total">0:00</span>
            </div>

            <div class="buttons-row">
                <button class="retro-btn" onclick="prevSong()">|&lt;</button>
                <button class="retro-btn" id="rp-play-btn" onclick="togglePlay()">▶ PLAY</button>
                <button class="retro-btn" onclick="nextSong()">&gt;|</button>
            </div>

            <ul class="playlist" id="rp-playlist">
                </ul>

        </div>
    </div>

    <audio id="rp-audio"></audio>

    <script>
        // --- 1. TU LISTA DE MÚSICA (Edita esto) ---

const myTracks = [
    { 
        title: "Access_1982", 
        file: "HYPERZONE_SONGS/Cancion1.mp3" 
    },
    { 
        title: "Bienvenido a HIPERZONE", 
        file: "HYPERZONE_SONGS/Bienvenido a HYPERZONE.mp3" 
    },
    { 
        title: "S.P.E.E.D Theme", 
        file: "HYPERZONE_SONGS/S.P.E.E.D Theme.mp3" 
    },
    { 
        title: "El Lobby De HYPERZONE", 
        file: "HYPERZONE_SONGS/El Lobby de HIPERZONE.mp3" 
    },
    { 
        title: "AQUO", 
        file: "HYPERZONE_SONGS/AQUO.mp3" 
    },
    { 
        title: "Líneas Temporales", 
        file: "HYPERZONE_SONGS/lineas Temporales.mp3" 
    },
    { 
        title: "Nule", 
        file: "HYPERZONE_SONGS/Nule.mp3" 
    },
    { 
        title: "Modular1", 
        file: "HYPERZONE_SONGS/Modular1.mp3" 
    },
    { 
        title: "Modular2", 
        file: "HYPERZONE_SONGS/Modular2.mp3" 
    },
    { 
        title: "Home", 
        file: "HYPERZONE_SONGS/Home.mp3" 
    },
    { 
        title: "The Last Rive In The Sky", 
        file: "HYPERZONE_SONGS/Last track in the sky.mp3" 
    },
    { 
        title: "Generic Loop", 
        file: "HYPERZONE_SONGS/Generic loop.mp3" 
    },
    { 
        title: "Hyperzone Republic", 
        file: "HYPERZONE_SONGS/Hiperzone republic.mp3" 
    },
    { 
        title: "City", 
        file: "HYPERZONE_SONGS/City.mp3" 
    },
    { 
        title: "Dragon In The Machine", 
        file: "HYPERZONE_SONGS/Dragon in the machine.mp3" 
    },
    { 
        title: "Party Jungle Shit 1", 
        file: "HYPERZONE_SONGS/Party Jungle Shit 1.mp3" 
    },
    { 
        title: "Party Jungle Shit 2", 
        file: "HYPERZONE_SONGS/Party Jungle Shit 2.mp3" 
    },
    { 
        title: "Funny Loop", 
        file: "HYPERZONE_SONGS/Funny Loop.mp3" 
    },
    { 
        title: "The Hyperzone Limit", 
        file: "HYPERZONE_SONGS/The Hiperzone limit.mp3" 
    },
    { 
        title: "Statik.ca", 
        file: "HYPERZONE_SONGS/Statik.ca.mp3" 
    },
    { 
        title: "Buzz", 
        file: "HYPERZONE_SONGS/Buzz.mp3" 
    },
    { 
        title: "Astrodinamic", 
        file: "HYPERZONE_SONGS/Astrodinamic.mp3" 
    },
    { 
        title: "Dream Machine Module.ca", 
        file: "HYPERZONE_SONGS/Dream Machine Module.mp3" 
    },
    { 
        title: "Dm status", 
        file: "HYPERZONE_SONGS/Dm status.mp3" 
    },
    { 
        title: "Ecodinamic", 
        file: "HYPERZONE_SONGS/Ecodinamic.mp3" 
    },
    { 
        title: "Trampa", 
        file: "HYPERZONE_SONGS/TRAMPA.mp3" 
    },
    { 
        title: "Generic DnB openmpt", 
        file: "HYPERZONE_SONGS/Generic DnB openmpt.mp3" 
    },
    { 
        title: "Introduccion a Dots", 
        file: "HYPERZONE_SONGS/Introduccion a Dots.mp3" 
    },
    { 
        title: "Enter Midzone", 
        file: "HYPERZONE_SONGS/Enter Midzone.mp3" 
    },


];

        let currentIndex = 0;
        const audio = document.getElementById('rp-audio');
        const playBtn = document.getElementById('rp-play-btn');
        const seekbar = document.getElementById('rp-seekbar');
        const currentText = document.getElementById('rp-current');
        const totalText = document.getElementById('rp-total');
        const trackName = document.getElementById('rp-track-name');
        const playlistEl = document.getElementById('rp-playlist');

        // --- 2. INICIALIZAR ---
        // Crear la lista visualmente
        function renderPlaylist() {
            playlistEl.innerHTML = "";
            myTracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.innerText = `${index + 1}. ${track.title}`;
                li.onclick = () => loadTrack(index);
                if (index === currentIndex) li.classList.add('active');
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            audio.src = myTracks[index].file;
            trackName.innerText = myTracks[index].title;
            renderPlaylist(); // Actualiza el color amarillo de la lista
            playAudio();
        }

        // --- 3. CONTROLES ---
        function togglePlay() {
            audio.paused ? playAudio() : pauseAudio();
        }

        function playAudio() {
            audio.play();
            playBtn.innerText = "|| PAUSE";
        }

        function pauseAudio() {
            audio.pause();
            playBtn.innerText = "▶ PLAY";
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % myTracks.length;
            loadTrack(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + myTracks.length) % myTracks.length;
            loadTrack(currentIndex);
        }

        // --- 4. BARRA DE PROGRESO ---
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                seekbar.value = (audio.currentTime / audio.duration) * 100;
                currentText.innerText = formatTime(audio.currentTime);
                totalText.innerText = formatTime(audio.duration);
            }
        });

        seekbar.addEventListener('input', () => {
            audio.currentTime = (seekbar.value / 100) * audio.duration;
        });

        audio.addEventListener('ended', nextSong);

        function formatTime(s) {
            if(isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0'+sec : sec}`;
        }

        // Cargar la primera sin reproducir
        renderPlaylist();
    </script>
</body>
</html>
