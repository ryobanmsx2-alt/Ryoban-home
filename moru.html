<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORU_INTERFACE // Aero-System</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="moru.css">
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <div class="aero-window">
        <header class="aero-header">
            <div class="header-content">
                <img src="FOT1.png" class="header-icon">
                <span>User Profile: Moru</span>
            </div>
            <div class="aero-controls">
                <div class="ctrl min"></div><div class="ctrl max"></div><div class="ctrl close"></div>
            </div>
        </header>

        <main class="aero-body">
            <div class="profile-grid">
                
                <aside class="glass-panel identity">
                    <div class="glossy-avatar">
                        <img src="moru.jpg" alt="Moru" class="avatar-img">
                        <div class="reflection"></div>
                    </div>
                    <div class="info-list">
                        <p><strong>ID:</strong> Moru Goethe</p>
                        <p>CHROMATIC MACHINE</p>
                        <p><strong>SYSTEM:</strong> Head of HYPERZONE </p>
                    </div>
                </aside>

                <section class="glass-panel main-content">
                    <h1 class="aero-title">ALIAS: Moru </h1>
                    
                    <div class="status-box">
                        <p>Sistema operativo optimizado. La creatividad fluye a través de los canales de HYPERZONE</p>
                    </div>

                    <div class="skills-aero">
                        <span>Supervisión de materia</span>
                        <div class="aero-bar">
                            <span></span>
                            <div class="track"><div class="fill" style="--target-width: 95%;"></div></div>
                        </div>
                        <br>
                        <div class="aero-bar">
                            <span>Creación de estructuras</span>
                            <div class="track"><div class="fill" style="--target-width: 88%;"></div></div>
                            <br>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="aero-footer">
            <div class="badge-dock">
                <img src="debian.gif" alt="Debian">
                <img src="php.png" alt="PHP">
                <img src="agender.png" alt="Agender">
            </div>
        </footer>
    </div>

</body>
</html>
